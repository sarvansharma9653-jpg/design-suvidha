<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="500" cy="100" r="140" fill="#ffffff" opacity="0.08"/>
  <circle cx="100" cy="500" r="180" fill="#ffffff" opacity="0.05"/>
  <g filter="url(#shadow)">
    <rect x="75" y="75" width="450" height="450" rx="28" fill="url(#card)" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="105" y="105" width="390" height="260" rx="18" fill="#0284c7" opacity="0.12"/>
    <circle cx="300" cy="225" r="70" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <text x="300" y="245" font-family="'Segoe UI', Arial, sans-serif" font-size="64" text-anchor="middle" fill="#0284c7">🆔</text>
    <rect x="115" y="390" width="130" height="24" rx="12" fill="#0284c7" opacity="0.2"/>
    <text x="180" y="407" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0284c7">DESIGN SUVIDHA</text>
    <text x="300" y="445" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle" fill="#0f172a">Custom PVC ID Cards</text>
    <text x="300" y="475" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#64748b">Employee, Student & Smart RFID</text>
    <line x1="160" y1="495" x2="440" y2="495" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>
